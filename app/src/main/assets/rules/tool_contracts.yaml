    grounds_completion: false
    label: tool.report_result
    category: SUPPORTING
    result_image_role: NONE
  update_memory:
    binding: TURN_LOCAL
    effect: STATE_CHANGING
    grounds_completion: false
    label: tool.update_memory
    category: SUPPORTING
    result_image_role: NONE
  experience:
