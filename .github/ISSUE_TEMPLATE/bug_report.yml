name: Bug report
description: Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: Remove API keys, personal data and device exports before sharing. Report vulnerabilities privately using SECURITY.md.
  - type: input
    id: version
    attributes:
      label: App version and build suffix
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, Android version and execution mode
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and validation performed
